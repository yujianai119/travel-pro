<script>
  (function() {
    // 1. 禁用右鍵選單
    document.addEventListener('contextmenu', (e) => e.preventDefault());

    // 2. 禁用 F12, Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+U (查看原始碼)
    document.addEventListener('keydown', (e) => {
      if (
        e.keyCode === 123 || // F12
        (e.ctrlKey && e.shiftKey && [73, 74, 67].includes(e.keyCode)) || // Ctrl+Shift+I/J/C
        (e.ctrlKey && e.keyCode === 85) // Ctrl+U
      ) {
        e.preventDefault();
        return false;
      }
    });

    // 3. 無限 Debugger 偵測器：一旦開啟 F12，頁面將會進入卡頓狀態
    const antiDebug = () => {
      const start = Date.now();
      debugger; // 如果開發者工具開啟，會在這裡停住
      if (Date.now() - start > 100) {
        // 如果偵測到被中斷，可以選擇清空頁面或導向其他網頁
        console.warn("系統偵測到異常操作，功能暫時鎖定。");
      }
    };
    setInterval(antiDebug, 1000);

    // 4. 防止文字被選取 (透過 CSS 輔助)
    const style = document.createElement('style');
    style.innerHTML = `
      body {
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
      }
    `;
    document.head.appendChild(style);
  })();
</script>
